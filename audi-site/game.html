<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Audi Circuit Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Inter',system-ui,sans-serif;touch-action:none;user-select:none}
#wrap{position:relative;border:2px solid #1a1a1a;overflow:hidden}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;padding:12px 16px}
.hb{background:rgba(0,0,0,0.75);padding:6px 12px;border:1px solid rgba(255,255,255,0.06)}
.hl{font-size:8px;text-transform:uppercase;letter-spacing:2px;color:#666}
.hv{font-size:18px;font-weight:700;color:#fff}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;justify-content:center;align-items:center}
#overlay h2{font-size:38px;font-weight:200;letter-spacing:-1px;color:#fff;margin-bottom:4px}
#overlay .sub{font-size:11px;color:#888;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
.keys{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.kk{text-align:center}.kk-key{display:inline-block;width:38px;height:38px;border:1px solid #333;line-height:38px;color:#aaa;font-size:14px;font-weight:600;margin-bottom:3px}
.kk-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:1px}
#overlay button{background:#BB0A30;color:#fff;border:none;padding:12px 48px;font-size:16px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;font-family:'Inter',system-ui,sans-serif}
#overlay button:hover{background:#d40a38}
#fs{font-size:44px;font-weight:700;color:#BB0A30;margin-bottom:4px}
#fb{font-size:12px;color:#666;margin-bottom:20px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
  <div class="hb"><div class="hl">LAP</div><div class="hv" id="ld">1/3</div></div>
  <div class="hb"><div class="hl">POS</div><div class="hv" id="pd">1st</div></div>
  <div class="hb"><div class="hl">TIME</div><div class="hv" id="td">0:00</div></div>
  <div class="hb"><div class="hl">BEST</div><div class="hv" id="bd">--</div></div>
</div>
<div id="overlay">
  <h2 id="ot">Audi Circuit Racing</h2>
  <div class="sub" id="os">Top-Down Track Challenge</div>
  <div class="keys" id="ok">
    <div class="kk"><div class="kk-key">← →</div><div class="kk-label">Steer</div></div>
    <div class="kk"><div class="kk-key">↑</div><div class="kk-label">Gas</div></div>
    <div class="kk"><div class="kk-key">↓</div><div class="kk-label">Brake</div></div>
  </div>
  <button id="ob" onclick="window._go()">RACE</button>
  <div id="fs" style="display:none">0</div>
  <div id="fb" style="display:none">0</div>
</div>
</div>

<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=Math.min(520,innerWidth-8),H=Math.min(750,innerHeight-8);
cv.width=W;cv.height=H;document.getElementById('wrap').style.width=W+'px';document.getElementById('wrap').style.height=H+'px';

// ===== TRACK DATA =====
// Track defined as a series of waypoints (center points of the road)
var trackPts=[
  // Outer circuit - goes clockwise
  {x:0.15,y:0.15},{x:0.30,y:0.12},{x:0.45,y:0.10},{x:0.60,y:0.10},{x:0.75,y:0.12},{x:0.85,y:0.18},
  {x:0.88,y:0.30},{x:0.87,y:0.42},{x:0.85,y:0.52},{x:0.80,y:0.60},
  {x:0.70,y:0.68},{x:0.55,y:0.72},{x:0.40,y:0.74},{x:0.25,y:0.72},{x:0.15,y:0.65},
  {x:0.10,y:0.55},{x:0.08,y:0.42},{x:0.10,y:0.30},
  // Inner section
  {x:0.20,y:0.25},{x:0.35,y:0.22},{x:0.50,y:0.20},{x:0.65,y:0.22},{x:0.75,y:0.28},
  {x:0.78,y:0.36},{x:0.75,y:0.44},{x:0.68,y:0.50},{x:0.55,y:0.54},{x:0.42,y:0.52},{x:0.32,y:0.48},
  {x:0.22,y:0.40},{x:0.18,y:0.32}
];
var tw=0.09; // wider track

// Scale track to canvas
var margin=30;
var sx=W-margin*2,sy=H-margin*2;
function tx(x){return margin+x*sx}
function ty(y){return margin+y*sy}
function ts(w){return w*sx}

// Pre-compute scaled track
var track=[];
var totalLen=0;
for(var i=0;i<trackPts.length;i++){
  var p0=trackPts[i],p1=trackPts[(i+1)%trackPts.length];
  var dx=tx(p1.x)-tx(p0.x),dy=ty(p1.y)-ty(p0.y);
  var segLen=Math.sqrt(dx*dx+dy*dy);
  track.push({x:tx(p0.x),y:ty(p0.y),nx:tx(p1.x),ny:ty(p1.y),len:segLen,total:totalLen,angle:Math.atan2(dy,dx)});
  totalLen+=segLen;
}
var trackW=ts(tw);

// ===== PLAYER =====
var player={pos:0,x:track[0].x,y:track[0].y,angle:track[0].angle,speed:0,ms:320,acc:220,brk:350,steer:4,lap:1,cp:0};

// ===== AI CARS =====
var ai=[];
var aiCols=['#e74c3c','#2980b9','#27ae60','#8e44ad','#f39c12'];
function buildAI(){
  ai=[];
  for(var i=0;i<5;i++){
    var p=totalLen*(0.15+i*0.12);
    var s=player.ms*0.65+Math.random()*player.ms*0.15;
    ai.push({pos:p%totalLen,spd:s,ms:s,col:aiCols[i],off:(Math.random()-0.5)*trackW*0.5,lapOffset:0});
  }
}

// ===== STATE =====
var running=false,raceTime=0,bestTime=null;
try{bestTime=parseFloat(localStorage.getItem('atrbest')||'0')||null}catch(e){}

// ===== INPUT =====
var k={};
onkeydown=function(e){k[e.key]=true;e.preventDefault()};
onkeyup=function(e){k[e.key]=false;e.preventDefault()};
var tx0=0,ty0=0,ta=false;
cv.addEventListener('touchstart',function(e){e.preventDefault();tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;ta=true});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();if(!ta||!running)return;
  var dx=e.touches[0].clientX-tx0,dy=e.touches[0].clientY-ty0;
  player.angle+=dx*0.04;tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
});
cv.addEventListener('touchend',function(){ta=false});

function getTrackInfo(pos){
  pos=((pos%totalLen)+totalLen)%totalLen;
  for(var i=0;i<track.length;i++){
    if(pos>=track[i].total&&pos<track[i].total+track[i].len)return track[i];
  }
  return track[0];
}

function update(dt){
  if(!running)return;dt=Math.min(dt,0.08);
  raceTime+=dt;

  // Speed
  if(k['ArrowUp']||k['w'])player.speed+=player.acc*dt;
  else if(k['ArrowDown']||k['s'])player.speed-=player.brk*dt;
  else player.speed+=player.acc*0.15*dt;
  player.speed=Math.max(0,Math.min(player.ms,player.speed));

  // Steering
  if(k['ArrowLeft']||k['a'])player.angle-=player.steer*dt;
  if(k['ArrowRight']||k['d'])player.angle+=player.steer*dt;

  // Move and track distance-based position
  player.x+=Math.cos(player.angle)*player.speed*dt;
  player.y+=Math.sin(player.angle)*player.speed*dt;
  player.pos+=player.speed*dt;

  // Find nearest track segment for visual alignment only
  var nearest=null,minDist=Infinity,segIdx=0;
  for(var i=0;i<track.length;i++){
    var t=track[i],dx=player.x-t.x,dy=player.y-t.y;
    var proj=(dx*(t.nx-t.x)+dy*(t.ny-t.y))/(t.len*t.len);
    proj=Math.max(0,Math.min(1,proj));
    var cx=t.x+proj*(t.nx-t.x),cy=t.y+proj*(t.ny-t.y);
    var dist=Math.sqrt((player.x-cx)*(player.x-cx)+(player.y-cy)*(player.y-cy));
    if(dist<minDist){minDist=dist;nearest={x:cx,y:cy,proj:proj,idx:i,dist:dist};segIdx=i}
  }

  // Strong snap to track center
  if(nearest){
    player.x+=(nearest.x-player.x)*4*dt;
    player.y+=(nearest.y-player.y)*4*dt;
  }

  // Snap angle toward track direction
  var tseg=track[segIdx];
  var angleDiff=tseg.angle-player.angle;
  while(angleDiff>Math.PI)angleDiff-=Math.PI*2;
  while(angleDiff<-Math.PI)angleDiff+=Math.PI*2;
  player.angle+=angleDiff*2*dt;

  // Checkpoint/lap detection using accumulated distance
  if(player.pos>player.cp+totalLen*0.9){
    player.lap++;player.cp=player.lap*totalLen;
    if(player.lap>3){finish();return}
    player.speed=Math.min(player.speed,player.ms*0.4);
    document.getElementById('ld').textContent=player.lap+'/3';
  }

  // Update AI
  for(var i=0;i<ai.length;i++){
    var a=ai[i],ati=getTrackInfo(a.pos);
    a.pos+=a.spd*dt;
    a.pos=a.pos%totalLen;
    var ati2=getTrackInfo(a.pos);
    a.spd+=player.acc*0.2*dt;
    a.spd=Math.max(a.ms*0.5,Math.min(a.ms,a.spd));
  }

  // Position (how many AI ahead by distance)
  var myDist=player.pos;
  var behind=0;
  for(var i=0;i<ai.length;i++){
    var aiDist=ai[i].pos+ai[i].lapOffset*totalLen;
    if(aiDist<myDist)behind++;
  }
  var pt=['1st','2nd','3rd','4th','5th','6th'];
  document.getElementById('pd').textContent=pt[Math.min(5,ai.length-behind)];
  document.getElementById('td').textContent=Math.floor(raceTime/60)+':'+(Math.floor(raceTime%60)<10?'0':'')+Math.floor(raceTime%60);
}

function finish(){
  running=false;
  var ft=Math.floor(raceTime*10)/10;
  document.getElementById('bd').textContent=ft+'s';
  if(!bestTime||ft<bestTime){bestTime=ft;try{localStorage.setItem('atrbest',bestTime)}catch(e){}}
  var o=document.getElementById('overlay');o.style.display='flex';
  document.getElementById('ot').textContent='Race Complete!';
  document.getElementById('os').textContent='';
  document.getElementById('fs').textContent=ft+'s';
  document.getElementById('fs').style.display='block';
  document.getElementById('fb').textContent='Best: '+(bestTime)+'s';
  document.getElementById('fb').style.display='block';
  document.getElementById('ob').textContent='RACE AGAIN';
  document.getElementById('ok').style.display='none';
}

function drawTrack(){
  // Grass
  ctx.fillStyle='#1a3a10';ctx.fillRect(0,0,W,H);

  // Draw track as thick path
  ctx.strokeStyle='#3a3a3a';ctx.lineWidth=trackW*2+8;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(track[0].x,track[0].y);
  for(var i=1;i<track.length;i++)ctx.lineTo(track[i].x,track[i].y);
  ctx.closePath();ctx.stroke();

  // Road surface
  ctx.strokeStyle='#404040';ctx.lineWidth=trackW*2;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(track[0].x,track[0].y);
  for(var i=1;i<track.length;i++)ctx.lineTo(track[i].x,track[i].y);
  ctx.closePath();ctx.stroke();

  // Lane markings (dashed center line)
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.setLineDash([14,18]);
  ctx.beginPath();ctx.moveTo(track[0].x,track[0].y);
  for(var i=1;i<track.length;i++)ctx.lineTo(track[i].x,track[i].y);
  ctx.closePath();ctx.stroke();ctx.setLineDash([]);

  // Track edges
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;
  for(var side=-1;side<=1;side+=2){
    ctx.beginPath();
    for(var i=0;i<track.length;i++){
      var t=track[i],perpX=-Math.sin(t.angle)*trackW*side,perpY=Math.cos(t.angle)*trackW*side;
      if(i===0)ctx.moveTo(t.x+perpX,t.y+perpY);
      else ctx.lineTo(t.x+perpX,t.y+perpY);
    }
    ctx.closePath();ctx.stroke();
  }

  // Start/finish line
  var sf=track[0];
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(sf.x-Math.sin(sf.angle)*trackW,sf.y+Math.cos(sf.angle)*trackW);
  ctx.lineTo(sf.x+Math.sin(sf.angle)*trackW,sf.y-Math.cos(sf.angle)*trackW);
  ctx.stroke();

  // Checkered pattern at start
  var nChecks=8;
  for(var c=0;c<nChecks;c++){
    if(c%2)continue;
    var f0=c/nChecks,f1=(c+1)/nChecks;
    var x0=sf.x-Math.sin(sf.angle)*trackW*(1-f0*2),y0=sf.y+Math.cos(sf.angle)*trackW*(1-f0*2);
    var x1=sf.x-Math.sin(sf.angle)*trackW*(1-f1*2),y1=sf.y+Math.cos(sf.angle)*trackW*(1-f1*2);
    ctx.fillStyle='#fff';
    ctx.fillRect(Math.min(x0,x1)-3,Math.min(y0,y1)-1,Math.abs(x1-x0)+6,3);
  }
}

function drawCar(x,y,angle,w,h,color,isPlayer){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  // Shadow
  if(isPlayer)ctx.fillStyle='rgba(0,0,0,0.4)';else ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(-w/2+2,-h/2+2,w,h);
  // Body
  var g=ctx.createLinearGradient(-w/2,0,w/2,0);
  if(isPlayer){
    g.addColorStop(0,'#1a1a1a');g.addColorStop(0.3,'#3a3a3a');g.addColorStop(0.5,'#4a4a4a');g.addColorStop(0.7,'#3a3a3a');g.addColorStop(1,'#1a1a1a');
  }else{
    g.addColorStop(0,color);g.addColorStop(1,color);
  }
  ctx.fillStyle=g;ctx.fillRect(-w/2,-h/2,w,h);
  // Windshield
  ctx.fillStyle='#1a3050';ctx.fillRect(-w/2+w*0.1,-h/2+h*0.08,w*0.8,h*0.18);
  // Wheels
  ctx.fillStyle='#0a0a0a';ctx.fillRect(-w/2-2,-h/2+h*0.2,4,h*0.26);ctx.fillRect(w/2-2,-h/2+h*0.2,4,h*0.26);
  ctx.fillRect(-w/2-2,h/2-h*0.46,4,h*0.26);ctx.fillRect(w/2-2,h/2-h*0.46,4,h*0.26);
  // Headlights (player only)
  if(isPlayer){ctx.fillStyle='#ffe8a0';ctx.fillRect(-w/2+w*0.15,-h/2-1,5,3);ctx.fillRect(w/2-w*0.25,-h/2-1,5,3)}
  ctx.restore();
}

function reset(){
  player.pos=0;player.x=track[0].x;player.y=track[0].y;player.angle=track[0].angle;
  player.speed=0;player.lap=1;player.cp=0;raceTime=0;
  buildAI();
  document.getElementById('ld').textContent='1/3';
  document.getElementById('pd').textContent='6th';
  document.getElementById('td').textContent='0:00';
  document.getElementById('bd').textContent=bestTime?bestTime+'s':'--';
}

window._go=function(){
  reset();
  var o=document.getElementById('overlay');o.style.display='flex';
  document.getElementById('ot').textContent='3';document.getElementById('os').textContent='';
  document.getElementById('ob').style.display='none';document.getElementById('ok').style.display='none';
  document.getElementById('fs').style.display='none';document.getElementById('fb').style.display='none';
  var c=3;
  function tick(){
    if(c>0){document.getElementById('ot').textContent=c;c--;setTimeout(tick,600)}
    else{document.getElementById('ot').textContent='GO!';setTimeout(function(){o.style.display='none';running=true;document.getElementById('ob').style.display='block';document.getElementById('ob').textContent='RACE';document.getElementById('ok').style.display='flex'},350)}
  }
  tick();
};

function draw(){
  ctx.clearRect(0,0,W,H);
  drawTrack();
  // AI cars
  for(var i=0;i<ai.length;i++){
    var a=ai[i],ti=getTrackInfo(a.pos);
    var ax=ti.x+(ti.nx-ti.x)*(a.pos-ti.total)/ti.len;
    var ay=ti.y+(ti.ny-ti.y)*(a.pos-ti.total)/ti.len;
    drawCar(ax,ay,ti.angle,16,22,a.col,false);
  }
  // Player
  drawCar(player.x,player.y,player.angle,18,26,'',true);
}

var lt=0;
function loop(t){var dt=lt?(t-lt)/1000:0.016;lt=t;if(dt>0&&dt<0.5)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
